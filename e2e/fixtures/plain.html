<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plain application form</title>
  </head>
  <body>
    <h1>Apply</h1>
    <form id="apply">
      <label for="first">First name</label>
      <input id="first" name="firstName" autocomplete="given-name" />

      <label for="last">Last name</label>
      <input id="last" name="lastName" autocomplete="family-name" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />

      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" name="linkedin" type="url" />

      <label for="city">City</label>
      <input id="city" name="city" autocomplete="address-level2" />

      <label for="state">State</label>
      <select id="state" name="state" autocomplete="address-level1">
        <option value="">Select…</option>
        <option value="6">California</option>
        <option value="33">New York</option>
        <option value="as">American Samoa</option>
      </select>

      <label
        >Country
        <select id="country" name="country" autocomplete="country">
          <option value="">Select…</option>
          <option value="14">Australia</option>
          <option value="231">United States of America</option>
        </select>
      </label>

      <fieldset>
        <legend>Are you legally authorized to work in the United States?</legend>
        <label><input type="radio" name="work_auth" value="yes" /> Yes</label>
        <label><input type="radio" name="work_auth" value="no" /> No</label>
      </fieldset>

      <fieldset>
        <legend>Will you require sponsorship from the company?</legend>
        <label><input type="radio" name="sponsor" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsor" value="no" /> No</label>
      </fieldset>

      <label for="hear">How did you hear about this opportunity?</label>
      <textarea id="hear" name="hear"></textarea>

      <label for="about">Tell us about yourself</label>
      <textarea id="about" name="about"></textarea>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
